name: Run C++ test files

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
    #allows manual testing with "Run workflow" button
  workflow_dispatch: 

env:
  BUILD_TYPE: Release

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Switch to main Ubuntu mirror
      run: |
        sudo sed -i 's|http://ubuntu.com|http://ubuntu.com|g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list || true
        sudo apt-get update
        
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ libgtest-dev libwayland-dev xorg-dev -y
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE= ${{env.BUILD_TYPE}}

    - name: Build Tests
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Run Tests
      working-directory: ${{github.workspace}}/build
      run: ctest --output-on-failure -C ${{env.BUILD_TYPE}}
